name: Snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/scripts/*snapshot*.sh'
  workflow_dispatch:
    inputs:
      ref:
        description: "main or a full commit SHA already in protected main history"
        required: false
        type: string
        default: "main"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Snapshot selection tests
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Require protected main for publication events
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          [[ "$GITHUB_REPOSITORY" == albertocavalcante/sky ]]
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_REF_PROTECTED" == true ]]
          [[ "$GITHUB_WORKFLOW_REF" == albertocavalcante/sky/.github/workflows/release.yml@refs/heads/main ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/test-snapshot-ref.sh

  resolve:
    name: Resolve trusted snapshot
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.select.outputs.commit }}
      version: ${{ steps.select.outputs.version }}
      date: ${{ steps.select.outputs.date }}
    steps:
      # This fence runs before checking out or executing repository code.
      - name: Require the protected main workflow
        shell: bash
        run: |
          [[ "$GITHUB_REPOSITORY" == albertocavalcante/sky ]]
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_REF_PROTECTED" == true ]]
          [[ "$GITHUB_WORKFLOW_REF" == albertocavalcante/sky/.github/workflows/release.yml@refs/heads/main ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze the selected commit and version
        id: select
        env:
          INPUT_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          commit=$(.github/scripts/resolve-snapshot.sh "$GITHUB_WORKSPACE")
          commit_date=$(git show -s --format=%cI "$commit")
          timestamp=$(date -u -d "$commit_date" +%Y%m%d%H%M%S)
          {
            printf 'commit=%s\n' "$commit"
            printf 'date=%s\n' "$commit_date"
            printf 'version=v0.0.0-%s-%s\n' "$timestamp" "${commit:0:12}"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build Snapshot
    needs: resolve
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"

    steps:
      - name: Prepare private executable scratch
        id: scratch
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/snapshot.XXXXXX")
          mkdir "$scratch/mod" "$scratch/tmp"
          {
            printf 'GOMODCACHE=%s/mod\n' "$scratch"
            printf 'GOTMPDIR=%s/tmp\n' "$scratch"
            printf 'TMPDIR=%s/tmp\n' "$scratch"
          } >>"$GITHUB_ENV"
          printf 'module_cache=%s/mod\n' "$scratch" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      # No tag exists for this source pin. Never load auth from the selected checkout.
      - name: Authenticate private modules using reviewed action source
        uses: albertocavalcante/sky/.github/actions/setup-cst-private-auth@423ef04490b88c60b3d6639550716984464eda1b # no corresponding tag
      - name: Setup Go
        uses: albertocavalcante/sky/.github/actions/setup-go-verified@22b20f1f5abe8e9a1441d518b7da038bb5e8c9aa # no corresponding tag

      - name: Build sky minimal
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w \
            -X github.com/albertocavalcante/sky/internal/version.version=${{ needs.resolve.outputs.version }} \
            -X github.com/albertocavalcante/sky/internal/version.commit=${{ needs.resolve.outputs.commit }} \
            -X github.com/albertocavalcante/sky/internal/version.date=${{ needs.resolve.outputs.date }}" \
            -o dist/sky-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/sky

      - name: Build sky full
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -tags=sky_full -ldflags="-s -w \
            -X github.com/albertocavalcante/sky/internal/version.version=${{ needs.resolve.outputs.version }} \
            -X github.com/albertocavalcante/sky/internal/version.commit=${{ needs.resolve.outputs.commit }} \
            -X github.com/albertocavalcante/sky/internal/version.date=${{ needs.resolve.outputs.date }}" \
            -o dist/sky_full-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/sky

      - name: Build standalone tools
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          for tool in skyfmt skylint skycheck skyquery skydoc skytest skyrepl skyls skycov sky-ci; do
            go build -trimpath -ldflags="-s -w \
              -X github.com/albertocavalcante/sky/internal/version.version=${{ needs.resolve.outputs.version }} \
              -X github.com/albertocavalcante/sky/internal/version.commit=${{ needs.resolve.outputs.commit }} \
              -X github.com/albertocavalcante/sky/internal/version.date=${{ needs.resolve.outputs.date }}" \
              -o dist/${tool}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
              ./cmd/${tool}
          done

      - name: Create checksums
        working-directory: dist
        run: sha256sum ./* > checksums-${{ matrix.goos }}-${{ matrix.goarch }}.txt

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sky-${{ needs.resolve.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 30
      - name: Remove private module source scratch
        if: always() && steps.scratch.outcome == 'success'
        env:
          SNAPSHOT_MODCACHE: ${{ steps.scratch.outputs.module_cache }}
        run: |
          [[ "$SNAPSHOT_MODCACHE" == "$RUNNER_TEMP"/snapshot.*/mod ]]
          cd "$RUNNER_TEMP"
          GOMODCACHE="$SNAPSHOT_MODCACHE" GOTOOLCHAIN=local go clean -modcache

  summary:
    name: Snapshot Summary
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    needs: [resolve, build]
    if: always() && needs.resolve.result == 'success'
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarize the same immutable selection
        env:
          SNAPSHOT_COMMIT: ${{ needs.resolve.outputs.commit }}
          SNAPSHOT_VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          {
            printf '## Snapshot\n\n- Version: %s\n- Commit: %s\n- Build result: %s\n' "$SNAPSHOT_VERSION" "$SNAPSHOT_COMMIT" "$BUILD_RESULT"
            printf '\nNo tag or GitHub Release was created. Successful artifacts are attached to this run.\n'
          } >>"$GITHUB_STEP_SUMMARY"
          test "$BUILD_RESULT" = success
