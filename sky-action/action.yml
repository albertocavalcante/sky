name: 'Sky Test'
description: 'Run Starlark tests with skytest - cross-platform (Linux, macOS, Windows)'
author: 'albertocavalcante'

inputs:
  path:
    description: 'Path to test files'
    required: false
    default: '.'
  recursive:
    description: 'Search directories recursively'
    required: false
    default: 'true'
  coverage:
    description: 'Enable coverage collection'
    required: false
    default: 'false'
  coverage-threshold:
    description: 'Minimum coverage percentage. Empty (default) defers to coverage.fail_under in the sky config; 0 explicitly disables the check. Requires coverage collection (coverage: true); a report with no measured lines fails the step instead of passing.'
    required: false
    default: ''
  annotations:
    description: 'Enable GitHub annotations'
    required: false
    default: 'true'
  summary:
    description: 'Write to job summary'
    required: false
    default: 'true'
  version:
    description: 'Sky module version, branch, or commit hash to install. Defaults to the action ref.'
    required: false
    default: ''
  fail-fast:
    description: 'Stop on first test failure'
    required: false
    default: 'false'
  timeout:
    description: 'Timeout per test (Go duration format, e.g., 30s, 1m)'
    required: false
    default: '30s'

outputs:
  passed:
    description: 'Number of passed tests'
    value: ${{ steps.test.outputs.passed }}
  failed:
    description: 'Number of failed tests'
    value: ${{ steps.test.outputs.failed }}
  coverage:
    description: 'Coverage percentage'
    value: ${{ steps.test.outputs.coverage }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
      with:
        go-version: '1.25'
        cache: true

    - name: Install sky tools
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          version="${GITHUB_ACTION_REF:-main}"
        fi
        go install "github.com/albertocavalcante/sky/cmd/skytest@${version}"
        go install "github.com/albertocavalcante/sky/cmd/sky-ci@${version}"

    # Pipeline pattern: skytest outputs JSON, sky-ci transforms to GitHub format
    # This is cross-platform - bash is available on all GitHub runners
    # Inputs are passed via env vars (never interpolated into the script) to
    # avoid shell injection.
    - name: Run tests
      id: test
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_RECURSIVE: ${{ inputs.recursive }}
        INPUT_FAIL_FAST: ${{ inputs.fail-fast }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_COVERAGE: ${{ inputs.coverage }}
        INPUT_COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        INPUT_SUMMARY: ${{ inputs.summary }}
      run: |
        FLAGS=()
        if [ "$INPUT_RECURSIVE" = "true" ]; then
          FLAGS+=(-r)
        fi
        if [ "$INPUT_FAIL_FAST" = "true" ]; then
          FLAGS+=(-x)
        fi
        if [ -n "$INPUT_TIMEOUT" ]; then
          FLAGS+=("-timeout=$INPUT_TIMEOUT")
        fi
        if [ "$INPUT_COVERAGE" = "true" ]; then
          FLAGS+=(-coverage)
        fi

        CI_FLAGS=("--annotations=$INPUT_ANNOTATIONS" "--summary=$INPUT_SUMMARY")
        if [ -n "$INPUT_COVERAGE_THRESHOLD" ]; then
          CI_FLAGS+=("--coverage-threshold=$INPUT_COVERAGE_THRESHOLD")
        fi

        # Run tests and pipe to CI reporter
        skytest -json "${FLAGS[@]}" -- "$INPUT_PATH" | sky-ci "${CI_FLAGS[@]}"

branding:
  icon: 'check-circle'
  color: 'blue'
